[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=artifacts
    # --headed
    # --slowmo 500
    # раскомменть эти флаги (--headed, --slowmo) для headed-режима

markers =
    smoke: core happy-path checks, fast feedback
    sanity: minimal "app is alive" checks
    critical: must-pass before merge / release
    regression: full regression suite
    ui: browser UI checks
    e2e: end-to-end user flows across pages
    positive: valid input / happy path
    negative: invalid input and error paths
    auth: authentication and session behaviour
    login: login page scenarios
    security: cookies, protected routes, enumeration, injection
